common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/handsfree/imu" 
    con_frame: false # true: if you need to combine several LiDAR frames into one
    con_frame_num: 1 # the number of frames combined
    scan_rate: 10 # number of scaned circles (360 degree) in one second

preprocess:
    lidar_type: 2
    scan_line: 16
    timestamp_unit: 2         # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 1.0               # near bline area
    det_range: 1000           # distance range

mapping:
    imu_en: true
    imu_time_inte: 0.00111 # = 1 / frequency of IMU 使用的imu频率是100hz，0.01
    lidar_time_inte: 0.1 # = 1 / frequency of LiDAR 使用的rslidar为10hz
    satu_acc: 30.0 # the saturation value of IMU's acceleration. not related to the units，加速度饱和值，最大30g,也就是30倍重力
    satu_gyro: 35 # the saturation value of IMU's angular velocity. not related to the units
    acc_norm: 9.795 # 9.810 # 1.0 for g as unit, 9.81 for m/s^2 as unit of the IMU's acceleration9.795，重力加速度模长
    lidar_meas_cov: 0.01 # 0.001; 0.01
    acc_cov_output: 500
    gyr_cov_output: 1000 
    b_acc_cov: 0.0001 
    b_gyr_cov: 0.0001 
    imu_meas_acc_cov: 0.1 #0.1 # 0.1
    imu_meas_omg_cov: 0.1 #0.01 # 0.1
    plane_thr: 0.1 # 0.05, the threshold for plane criteria, the smaller, the flatter a plane
    match_s: 81 # parameter for matching check, the larger, the harder to manifest a match
    ivox_grid_resolution: 1.0 # length (m) of voxels for grid map2.0
                                    #重力矢量 = -IMU静止时的加速度测量值
    gravity: [0.0, 0.0, 9.795] # # [0.0, 0.0, -9.787561] # gvins #说一下，为什么我们要填正的9.795，因为静止的时候，测得的Z轴加速度-9.795是支持力对应的加速度（也说明imuZ轴向下，对应的支持力和Z轴反向），这时候的重力加速度应该和这个支持力加速度等大反向，所以应该为9.795

    init_with_imu: true
    gravity_init: [0.0, 0.0, 9.795] # preknown gravity in IMU frame. used when it is impossible to estimate it from acc measurements, i.e., init_with_imu is false
    extrinsic_T: [0.0, 0.0, 0.14]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ] # extrinsics of LiDAR to IMU represented in IMU frame

gnss:
    gnss_enable: false # enable fuse GNSS
    ephem_from_rinex: false # true: read ephem from rinex. false: get ephem from rosbag（rinex和rosbag，是两种存储卫星导航数据的两种文件）
    ephem_file_name: "BRDM00DLR_S_20221870000_01D_MN.rnx"
    obs_from_rinex: false # true: read gnss obs (e.g., pseudo range, doppler, carrier-phase) from rinex. false: get obs from rosbag

    pvt_is_gt: false # true: the rtk (ground truth) is solved online and saved in /ublox_driver/receiver_pvt topic. false: read rtk from local file  
    gt_file_name: "tree3x.txt"            #gnss的真值轨迹
    gt_file_type: 3                    # 1: livox, 2: urban, 3: m2dgr

    outlier_rejection: true # true: use robust function for gnss factors
    psr_dopp_weight: 1 # 10 1  伪距多普勒因子在图优化中的相对权重
    cp_weight: 10 # 10		载波相位因子在图优化中的相对权重（载波精度高，权重给得大）

    gnss_meas_topic: "/ublox_driver/range_meas"           # GNSS raw measurement topic，原始观测数据话题，包括伪距（Pseudorange）、载波相位（Carrier Phase）、多普勒频率（Doppler）以及信号强度（C/N0）。
    gnss_ephem_topic: "/ublox_driver/ephem"               # GPS, Galileo, BeiDou ephemeris，常规星历，包含了 GPS、Galileo（欧洲）、BeiDou（北斗）这些卫星的开普勒轨道参数和卫星钟差参数。LIGO 拿到伪距后，会用这个星历数据通过复杂的数学公式（在 src/GNSS_Processing_fg.cpp 中），精准计算出信号发射那一瞬间卫星在 ECEF（地球中心）坐标系下的 XYZ 坐标。
    gnss_glo_ephem_topic: "/ublox_driver/glo_ephem"       # GLONASS ephemeris,电离层参数,LIGO 会利用这些参数对伪距进行大气延迟补偿，消除误差。
    gnss_iono_params_topic: "/ublox_driver/iono_params"   # GNSS broadcast ionospheric parameters
    gnss_tp_info_topic: "/ublox_driver/time_pulse_info"   # PPS time info,PPS 时间脉冲,这个话题帮助系统将工控机的系统时间、ROS 时间与极度精确的 GNSS 卫星原子钟时间进行对齐。
    rtk_pvt_topic: "/ublox_driver/receiver_pvt"           # gnss pvt soln msg,PVT 代表 Position, Velocity, Time。它是 u-blox 特有的一种极其丰富的数据包。除了经纬度，最重要的是它包含了**当前解算状态（Fix, Float, 单点定位）**和预计精度。LIGO 通过它来判断当前的 GNSS 信号质量是否足以进行初始化。
    rtk_lla_topic: "/ublox_driver/receiver_lla"           # nav sat fix最基础的 sensor_msgs/NavSatFix 格式话题，就是你在 NMEA $GNGGA 里看到的经度、纬度、高度。配置文件里关闭了紧耦合（gnss_enable: false），打开了松耦合（nmea_enable: true），系统就会无视前面 1-5 所有的原始数据，只吃这一个话题来进行基于位置因子的图优化。
    
    gnss_elevation_thres: 15            # satellite elevation threshold (degree) 30，仰角截止角。低于 15 度的卫星由于大气折射严重，会被直接丢弃不用。
    gnss_psr_std_thres: 30.0             # pseudo-range std threshold
    gnss_dopp_std_thres: 30.0            # doppler std threshold
    gnss_cp_std_thres: 30.0            # carrier phase std threshold
    gnss_cp_time_thres: 100.0            # single-differenced carrier phase factor time threshold
    gtsam_variable_thres: 30            # the window size for GNSS obs
    gtsam_marg_variable_thres: 1
    gnss_sample_period: 1               # = 1 / frequency of GNSS obs
    outlier_thres: 1 # 0.1 # parameter for robust function of GNSS factors
    outlier_thres_init: 20 # parameter for robust fucntion of initial GNSS factors
    window_size: 10 # <= 10 # window size of GNSS observations used for intialization
    prior_noise: 1000 # 100 # factor cov for initial factors
    marg_noise: 0.1 # factor cov for marginalized factors
    odo_noise: 0.1 # 1 # factor cov for LiDAR-Inertial factors
    grav_noise: 0.1 # 0.1 0.5 # factor cov for gravity factors
    psr_dopp_noise: 0.1 # factor cov for pseudo-range factors
    cp_noise: 0.01 # factor cov for carrier-phase factors
    gnss_ekf_noise: 0.01 # measurement cov for gnss in ekf of front-end
    gnss_local_online_sync: false                       # if perform online synchronization betwen GNSS and local time
    local_trigger_info_topic: "/external_trigger"   # external trigger info of the local sensor, if `gnss_local_online_sync` is 1
    gnss_local_time_diff: 18.0 # 9.062 # ? yes # difference between GNSS and local time (s), if `gnss_local_online_sync` is 0 18.0 # should be 
    gnss_iono_default_parameters: [0.1118E-07,  0.2235E-07, -0.4172E-06,  0.6557E-06, 0.1249E+06, -0.4424E+06,  0.1507E+07, -0.2621E+06] #大气补偿参数
    
    gnss_extrinsic_T: [-0.20, 0.0 , 0.16] 
    # gnss_extrinsic_R: [ 1, 0, 0,
    #                 0, 0, 1,
    #                 0, -1, 0 ]
    # gnss_extrinsic_R: [ 1, 0, 0,
    #                 0, -1, 0,
    #                 0, 0, -1 ]
    gnss_extrinsic_R: [ 1, 0, 0,
                    0, 1, 0,
                    0, 0, 1 ] # extrinsics of the GNSS receiver to IMU represented in IMU frame
    # gnss_extrinsic_R: [ 0, 1,  0,
    #                     -1, 0, 0,
    #                     0, 0, 1 ]

nmea:
    nmea_enable: true # enable fuse ppp results of gnss observations ,nmea是卫星定位的数据格式协议。是否使用nmea数据，false才使用gnss的紧耦合数据，为true则使用gnss的松耦合数据。
    posit_odo_topic: "/rtk/gps_odom" # "/mavros/local_position/odom" 这是gnss里程计话题，主要读取里程计中的位置，需要我们将原始的NMEA的LLA转换为局部ENU的xyz。
    ppp_std_thres: 1000.0 # ppp solution std thred  熔断机制，GPS 误差不超过 1000 米，它统统照单全收，无所谓，我转换里程计数据的时候已经进行过滤了gps不好的信号，因子图优化（终极审判，ppp_std_thres 登场！）gpsHandler() 或 nmea_meas_callback()只是搬运工，塞入队列就行了。而对于作者的gpsHandler逻辑，协方差都设置的接近0，而熔断门槛又为1000，自然全加入到图优化中了
    pos_noise: 1 # factor cov for position factors
    nmea_weight: 100.0  #原来是1000
    nmea_local_time_diff: 0.0 # 27.062 # difference between PPP solution and local time (s)
    ppp_file_name: "switch2.pos" # "deg2.pos" # ""这是一个公共数据集，文件直接提供了 ECEF 笛卡尔坐标系的 XYZ 值（单位：米）。不跑gnss数据集，就不需要读取这个文件，而是读取posit_odo_topic话题
    ppp_anc: [-2349096.342, 5404261.218, 2432320.677] # logo 系统会把这里的 ECEF 坐标作为 ENU 的原点 (0,0,0)。如果您想在特定的局部坐标系下定位，就需要修改这个值。
             # [-2152900.934855,4380649.467661,4091851.462459] # bri 
             # [-2169505.899002,4385241.855870,4078231.236204] # out  

odometry: 
    publish_odometry_without_downsample: false

publish:
    path_en: true                 # false: close the path output
    scan_publish_en: true         # false: close all the point cloud output
    scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: true
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
